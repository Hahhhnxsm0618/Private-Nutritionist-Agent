[project]
name = "nutrition-agent-api"
version = "0.1.0"
description = "Nutrition Agent API skeleton"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2,<1.0",
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.9,<3.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
